  <path d="M 0 35 C 50 50, 150 20, 200 35" stroke="#0B0F19" stroke-width="1.2" stroke-opacity="0.09" fill="none"/>
  <path d="M 0 60 C 50 75, 150 45, 200 60" stroke="#0B0F19" stroke-width="1.2" stroke-opacity="0.08" fill="none"/>
  <path d="M 0 85 C 50 100, 150 70, 200 85" stroke="#0B0F19" stroke-width="1.2" stroke-opacity="0.09" fill="none"/>
  
  <!-- Subtle Charcoal Accent Waves -->
  <path d="M 0 22 C 50 37, 150 7, 200 22" stroke="#0B0F19" stroke-width="1.2" stroke-opacity="0.08" fill="none"/>
