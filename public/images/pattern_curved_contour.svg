  <path d="M 0 35 C 50 50, 150 20, 200 35" stroke="#1B1754" stroke-width="1.2" stroke-opacity="0.14" fill="none"/>
  <path d="M 0 60 C 50 75, 150 45, 200 60" stroke="#1B1754" stroke-width="1.2" stroke-opacity="0.12" fill="none"/>
  <path d="M 0 85 C 50 100, 150 70, 200 85" stroke="#1B1754" stroke-width="1.2" stroke-opacity="0.14" fill="none"/>
  
  <!-- Subtle Emerald Green Accent Waves (#2DE054) -->
  <path d="M 0 22 C 50 37, 150 7, 200 22" stroke="#2DE054" stroke-width="1.4" stroke-opacity="0.38" fill="none"/>
  <path d="M 0 72 C 50 87, 150 57, 200 72" stroke="#2DE054" stroke-width="1.4" stroke-opacity="0.38" fill="none"/>

  <!-- Counter-curve for organic contour depth -->
